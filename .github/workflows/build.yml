name: Build Pre-installed Official SteamOS AMD (32GB - BTRFS Compresion)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bake-official-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Virtualization Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm qemu-utils udev parted gdisk aria2 bzip2

      - name: Download Valve Official Recovery Image
        run: |
          mkdir -p workspace output
          echo "Descargando última imagen oficial de Valve..."
          aria2c -x 16 -s 16 "https://steamos.cloud" -d workspace
          echo "Descomprimiendo imagen base..."
          bunzip2 workspace/steamdeck-recovery-4.img.bz2

      - name: Create 32GB Target Virtual Disk
        run: |
          qemu-img create -f raw workspace/steamos-installed.img 32G

      - name: Patch Valve Installer and Execute Pre-installation via QEMU
        run: |
          cd workspace
          sudo losetup -P -f steamdeck-recovery-4.img
          LOOP_DEV=$(sudo losetup -j steamdeck-recovery-4.img | awk -F: '{print $1}')
          
          sudo mkdir -p /mnt/recovery
          sudo mount "${LOOP_DEV}p4" /mnt/recovery || sudo mount "${LOOP_DEV}p2" /mnt/recovery

          TARGET_REPAIR="/mnt/recovery/usr/bin/repair_device.sh"
          if [ -f "$TARGET_REPAIR" ]; then
            sudo sed -i 's/sfdisk --unit S/sfdisk --unit B/g' "$TARGET_REPAIR"
            sudo sed -i 's/DISK="\/dev\/nvme0n1"/DISK="\/dev\/sda"/g' "$TARGET_REPAIR"
          fi

          sudo umount /mnt/recovery
          sudo losetup -d "$LOOP_DEV"

          echo "=== Iniciando instalación desatendida oficial ==="
          qemu-system-x86_64 -m 4096 -smp 4 -headless \
            -drive file=steamos-installed.img,format=raw,id=hd0 \
            -drive file=steamdeck-recovery-4.img,format=raw,id=recovery \
            -boot d -vnc :1 &
          
          sleep 300
          pkill qemu-system-x86_64 || true

      - name: Inject BTRFS Compression & Auto-Expand Logic
        run: |
          IMG_PATH="workspace/steamos-installed.img"
          sudo losetup -P -f "$IMG_PATH"
          LOOP_TARGET=$(sudo losetup -j "$IMG_PATH" | awk -F: '{print $1}')
          
          sudo mkdir -p /mnt/installed_sys
          sudo mount "${LOOP_TARGET}p4" /mnt/installed_sys || true
          
          # Creamos el script que se ejecutará en el primer inicio del hardware real
          sudo mkdir -p /mnt/installed_sys/usr/bin/
          cat << 'EOF' | sudo tee /mnt/installed_sys/usr/bin/steamos-expand-unattended.sh
          #!/bin/bash
          # 1. Detectar el disco real
          REAL_DISK=$(lsblk -d -n -o NAME | grep -E "nvme|sd|mmc" | head -n 1)
          DISK_DEV="/dev/$REAL_DISK"
          PART_DEV="${DISK_DEV}8"
          if [[ "$REAL_DISK" == nvme* || "$REAL_DISK" == mmcblk* ]]; then
              PART_DEV="${DISK_DEV}p8"
          fi
          
          echo "Reparando y expandiendo tabla GPT en $DISK_DEV..."
          sudo sgdisk -e $DISK_DEV
          sudo parted -s $DISK_DEV resizepart 8 100%
          sudo partprobe $DISK_DEV
          
          echo "Formateando partición de juegos a BTRFS..."
          # Forzamos el formateo a BTRFS eliminando rastros anteriores de EXT4
          sudo umount $PART_DEV 2>/dev/null || true
          sudo mkfs.btrfs -f -L "home" $PART_DEV
          
          echo "Configurando montaje con compresión ZSTD en /etc/fstab..."
          # Reemplazamos la línea de montaje de /home en fstab para usar BTRFS con compresión zstd:3 (óptimo rendimiento/espacio)
          sudo sed -i '/\/home/d' /etc/fstab
          echo "LABEL=home /home btrfs defaults,noatime,compress=zstd:3,ssd,space_cache=v2 0 2" | sudo tee -a /etc/fstab
          
          # Montar y expandir al máximo físico del disco
          sudo mkdir -p /tmp/home_mount
          sudo mount -t btrfs $PART_DEV /tmp/home_mount
          sudo btrfs filesystem resize max /tmp/home_mount
          sudo umount /tmp/home_mount
          
          echo "=== BTRFS con compresión ZSTD configurado exitosamente ==="
          EOF
          sudo chmod +x /mnt/installed_sys/usr/bin/steamos-expand-unattended.sh

          # Enlazar al script de primer arranque nativo de SteamOS
          if [ -f "/mnt/installed_sys/usr/bin/steamos-firstboot.sh" ]; then
            echo "/usr/bin/steamos-expand-unattended.sh" | sudo tee -a /mnt/installed_sys/usr/bin/steamos-firstboot.sh
          fi

          sudo umount /mnt/installed_sys || true
          sudo losetup -d "$LOOP_TARGET"

      - name: Compress and Export Pre-installed Image
        run: |
          mv workspace/steamos-installed.img output/steamos-official-amd-btrfs-32gb.img
          cd output
          tar -czvf steamos-official-amd-btrfs-32gb.img.tar.gz steamos-official-amd-btrfs-32gb.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: steamos-btrfs-listo
          path: output/steamos-official-amd-btrfs-32gb.img.tar.gz
          retention-days: 3
