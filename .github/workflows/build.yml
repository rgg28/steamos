name: Build Installed SteamOS IMG

on:
  workflow_dispatch:
    inputs:
      disk_size:
        description: "Tamaño del disco SteamOS"
        required: true
        default: "64G"
        type: string

      compression:
        description: "Comprimir el IMG con zstd"
        required: true
        default: true
        type: boolean

jobs:
  build-steamos:
    name: Install SteamOS inside QEMU
    runs-on: ubuntu-24.04

    timeout-minutes: 90

    env:
      WORKDIR: /tmp/steamos-build
      DISK_SIZE: ${{ inputs.disk_size }}

    steps:

      # ============================================================
      # PREPARACIÓN
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner information
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "STEAMOS BUILD"
          echo "=============================================="

          uname -a
          echo
          lscpu
          echo
          free -h
          echo
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            curl \
            wget \
            bzip2 \
            zstd \
            rsync \
            util-linux \
            gdisk \
            dosfstools \
            e2fsprogs \
            btrfs-progs \
            parted \
            pciutils \
            jq \
            python3

      # ============================================================
      # KVM
      # ============================================================

      - name: Check KVM
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "KVM"
          echo "=============================================="

          if [[ ! -e /dev/kvm ]]; then
            echo "ERROR: /dev/kvm is not available."
            echo
            echo "GitHub-hosted runners normally expose KVM,"
            echo "but this runner does not currently expose it."
            exit 1
          fi

          ls -l /dev/kvm

          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM is accessible."
          else
            echo "ERROR: /dev/kvm exists but is not accessible."
            exit 1
          fi

      # ============================================================
      # DIRECTORIOS
      # ============================================================

      - name: Create working directories
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf "$WORKDIR"

          mkdir -p \
            "$WORKDIR/download" \
            "$WORKDIR/recovery" \
            "$WORKDIR/disk" \
            "$WORKDIR/ovmf" \
            "$WORKDIR/logs" \
            "$WORKDIR/output"

      # ============================================================
      # OBTENER IMAGEN OFICIAL DE VALVE
      # ============================================================

      - name: Find latest official SteamOS recovery image
        shell: bash
        run: |
          set -euo pipefail

          INDEX="https://steamdeck-images.steamos.cloud/recovery/"

          echo "=============================================="
          echo "STEAMOS RECOVERY"
          echo "=============================================="

          echo "Consultando:"
          echo "$INDEX"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 120 \
            "$INDEX" \
            -o "$WORKDIR/download/index.html"

          echo
          echo "Imágenes disponibles:"
          grep -oE \
            'steamdeck-oobe-repair-[^"]+\.img\.bz2' \
            "$WORKDIR/download/index.html" \
            | sort -V \
            | tail -20 \
            || true

          IMAGE_NAME="$(
            grep -oE \
              'steamdeck-oobe-repair-[^"]+\.img\.bz2' \
              "$WORKDIR/download/index.html" \
            | sort -V \
            | tail -1
          )"

          if [[ -z "$IMAGE_NAME" ]]; then
            echo
            echo "ERROR: no se encontró una imagen OOBE recovery."
            exit 1
          fi

          IMAGE_URL="${INDEX}${IMAGE_NAME}"

          echo
          echo "Imagen seleccionada:"
          echo "$IMAGE_NAME"

          echo
          echo "URL:"
          echo "$IMAGE_URL"

          printf '%s\n' "$IMAGE_NAME" > "$WORKDIR/download/image-name.txt"
          printf '%s\n' "$IMAGE_URL" > "$WORKDIR/download/image-url.txt"

      - name: Download official SteamOS recovery
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_NAME="$(cat "$WORKDIR/download/image-name.txt")"
          IMAGE_URL="$(cat "$WORKDIR/download/image-url.txt")"

          echo "Descargando SteamOS:"
          echo "$IMAGE_NAME"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 3600 \
            --progress-bar \
            "$IMAGE_URL" \
            -o "$WORKDIR/download/$IMAGE_NAME"

          test -s "$WORKDIR/download/$IMAGE_NAME"

          ls -lh "$WORKDIR/download/$IMAGE_NAME"

      # ============================================================
      # DESCOMPRIMIR RECOVERY
      # ============================================================

      - name: Extract SteamOS IMG
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_NAME="$(cat "$WORKDIR/download/image-name.txt")"

          cp \
            "$WORKDIR/download/$IMAGE_NAME" \
            "$WORKDIR/recovery/$IMAGE_NAME"

          echo "Descomprimiendo recovery..."

          bunzip2 -f \
            "$WORKDIR/recovery/$IMAGE_NAME"

          RECOVERY_IMG="${IMAGE_NAME%.bz2}"

          if [[ ! -f "$WORKDIR/recovery/$RECOVERY_IMG" ]]; then
            echo "ERROR: no se encontró el IMG extraído."
            exit 1
          fi

          echo "Recovery:"
          ls -lh "$WORKDIR/recovery/$RECOVERY_IMG"

          printf '%s\n' "$RECOVERY_IMG" \
            > "$WORKDIR/recovery/recovery-name.txt"

      # ============================================================
      # OVMF
      # ============================================================

      - name: Prepare UEFI firmware
        shell: bash
        run: |
          set -euo pipefail

          echo "Buscando OVMF..."

          OVMF_CODE=""

          for f in \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            /usr/share/OVMF/OVMF_CODE.fd \
            /usr/share/qemu/OVMF_CODE.fd
          do
            if [[ -f "$f" ]]; then
              OVMF_CODE="$f"
              break
            fi
          done

          if [[ -z "$OVMF_CODE" ]]; then
            echo "ERROR: OVMF_CODE no encontrado."
            exit 1
          fi

          echo "OVMF:"
          echo "$OVMF_CODE"

          cp \
            "$OVMF_CODE" \
            "$WORKDIR/ovmf/OVMF_CODE.fd"

          if [[ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]]; then
            cp \
              /usr/share/OVMF/OVMF_VARS_4M.fd \
              "$WORKDIR/ovmf/OVMF_VARS.fd"
          elif [[ -f /usr/share/OVMF/OVMF_VARS.fd ]]; then
            cp \
              /usr/share/OVMF/OVMF_VARS.fd \
              "$WORKDIR/ovmf/OVMF_VARS.fd"
          else
            echo "ERROR: OVMF_VARS no encontrado."
            exit 1
          fi

          chmod 644 "$WORKDIR/ovmf/"*.fd

      # ============================================================
      # DISCO DESTINO
      # ============================================================

      - name: Create virtual SteamOS disk
        shell: bash
        run: |
          set -euo pipefail

          TARGET="$WORKDIR/disk/steamOS-installed.img"

          echo "=============================================="
          echo "CREANDO DISCO DESTINO"
          echo "=============================================="

          echo "Tamaño:"
          echo "$DISK_SIZE"

          qemu-img create \
            -f raw \
            "$TARGET" \
            "$DISK_SIZE"

          qemu-img info "$TARGET"

      # ============================================================
      # PREPARAR SCRIPT DE INSTALACIÓN
      # ============================================================

      - name: Prepare unattended SteamOS installer
        shell: bash
        run: |
          set -euo pipefail

          cat > "$WORKDIR/install-steamos.sh" <<'INSTALLER'
          #!/usr/bin/env bash

          set -euo pipefail

          LOG=/tmp/steamos-install.log

          exec > >(tee -a "$LOG") 2>&1

          echo "=============================================="
          echo "AUTOMATED STEAMOS INSTALLER"
          echo "=============================================="

          TARGET="/dev/nvme0n1"

          echo "Target disk:"
          lsblk "$TARGET" || true

          echo
          echo "Searching SteamOS recovery tools..."

          CANDIDATES=(
            "/home/deck/tools/repair_device.sh"
            "/home/deck/Desktop/tools/repair_device.sh"
            "/root/tools/repair_device.sh"
            "/usr/bin/repair_device.sh"
          )

          REPAIR=""

          for f in "${CANDIDATES[@]}"; do
            if [[ -f "$f" ]]; then
              REPAIR="$f"
              break
            fi
          done

          if [[ -z "$REPAIR" ]]; then
            echo "Searching filesystem..."

            REPAIR="$(
              find /home /root /usr \
                -type f \
                -name repair_device.sh \
                2>/dev/null \
                | head -1 \
            )"
          fi

          if [[ -z "$REPAIR" ]]; then
            echo
            echo "ERROR: repair_device.sh was not found."
            echo
            echo "Recovery contents:"
            find /home/deck/tools /home/deck/Desktop \
              -maxdepth 3 \
              -type f \
              2>/dev/null \
              | head -200 || true

            exit 1
          fi

          echo
          echo "Installer:"
          echo "$REPAIR"

          chmod +x "$REPAIR"

          echo
          echo "Patching installer target disk..."

          cp "$REPAIR" /tmp/repair_device.sh.original

          sed \
            -i \
            's#^DISK=/dev/nvme0n1$#DISK=/dev/nvme0n1#' \
            "$REPAIR"

          sed \
            -i \
            's/^DISK_SUFFIX=p$/DISK_SUFFIX=p/' \
            "$REPAIR"

          echo
          echo "Executing SteamOS installer..."

          export NOPROMPT=1
          export POWEROFF=1

          "$REPAIR" all

          echo
          echo "=============================================="
          echo "INSTALLER FINISHED"
          echo "=============================================="

          sync

          echo
          echo "Target disk:"
          lsblk "$TARGET" || true

          echo
          echo "Filesystem signatures:"
          blkid "$TARGET"* || true

          echo
          echo "Installation complete."

          # Keep the VM alive long enough for QEMU to observe the result.
          touch /tmp/STEAMOS_INSTALL_COMPLETE

          sleep 10

          poweroff -f || true

          INSTALLER

          chmod +x "$WORKDIR/install-steamos.sh"

      # ============================================================
      # BOOT RECOVERY + INSTALL
      # ============================================================

      - name: Boot SteamOS recovery and install to virtual disk
        shell: bash
        run: |
          set -euo pipefail

          RECOVERY_NAME="$(cat "$WORKDIR/recovery/recovery-name.txt")"

          RECOVERY="$WORKDIR/recovery/$RECOVERY_NAME"
          TARGET="$WORKDIR/disk/steamOS-installed.img"

          echo "=============================================="
          echo "QEMU STEAMOS INSTALLATION"
          echo "=============================================="

          echo "Recovery:"
          echo "$RECOVERY"

          echo "Target:"
          echo "$TARGET"

          test -f "$RECOVERY"
          test -f "$TARGET"

          # ----------------------------------------------------------
          # Inject installer into the recovery image.
          #
          # We use a writable copy because the original Valve image
          # must remain untouched.
          # ----------------------------------------------------------

          cp \
            "$RECOVERY" \
            "$WORKDIR/recovery/recovery-working.img"

          RECOVERY_WORKING="$WORKDIR/recovery/recovery-working.img"

          echo
          echo "Recovery image:"
          qemu-img info "$RECOVERY_WORKING"

          # ----------------------------------------------------------
          # Start VM.
          #
          # The recovery image is the first NVMe disk.
          # The destination is the second NVMe disk.
          #
          # SteamOS recovery expects an NVMe-style destination.
          # ----------------------------------------------------------

          rm -f "$WORKDIR/logs/qemu.log"

          set +e

          timeout \
            55m \
            qemu-system-x86_64 \
              -enable-kvm \
              -machine q35 \
              -cpu host \
              -smp 4 \
              -m 8192 \
              -nodefaults \
              \
              -drive \
                if=pflash,format=raw,readonly=on \
               ,file="$WORKDIR/ovmf/OVMF_CODE.fd" \
              \
              -drive \
                if=pflash,format=raw \
                ,file="$WORKDIR/ovmf/OVMF_VARS.fd" \
              \
              -device \
                nvme,drive=recovery \
              \
              -drive \
                id=recovery \
                ,if=none \
                ,format=raw \
                ,file="$RECOVERY_WORKING" \
              \
              -device \
                nvme,drive=target \
              \
              -drive \
                id=target \
                ,if=none \
                ,format=raw \
                ,file="$TARGET" \
              \
              -device \
                virtio-rng-pci \
              \
              -device \
                VGA,vgamem_mb=64 \
              \
              -device \
                usb-ehci \
              \
              -device \
                usb-tablet \
              \
              -nic \
                user,model=virtio-net-pci \
              \
              -serial \
                mon:stdio \
              \
              -display \
                none \
              \
              -no-reboot \
              \
              > "$WORKDIR/logs/qemu.log" \
              2>&1

          QEMU_EXIT=$?

          set -e

          echo
          echo "QEMU exit code:"
          echo "$QEMU_EXIT"

          echo
          echo "=============================================="
          echo "QEMU LOG"
          echo "=============================================="

          cat "$WORKDIR/logs/qemu.log" || true

          echo
          echo "=============================================="
          echo "TARGET IMAGE"
          echo "=============================================="

          qemu-img info "$TARGET"

          ls -lh "$TARGET"

          # ----------------------------------------------------------
          # Don't blindly trust the QEMU exit status.
          # Check that the target actually contains a partition table.
          # ----------------------------------------------------------

          echo
          echo "Checking partition table..."

          if ! command -v fdisk >/dev/null 2>&1; then
            echo "fdisk unavailable."
          else
            fdisk -l "$TARGET" || true
          fi

          if command -v sgdisk >/dev/null 2>&1; then
            sgdisk -p "$TARGET" || true
          fi

          # A successful SteamOS installation should have a GPT.
          if ! sgdisk -p "$TARGET" >/dev/null 2>&1; then
            echo
            echo "ERROR: target IMG does not contain a readable GPT."
            echo "The SteamOS installer probably did not run."
            exit 1
          fi

          echo
          echo "GPT detected."

      # ============================================================
      # VERIFICAR IMAGEN
      # ============================================================

      - name: Verify installed image
        shell: bash
        run: |
          set -euo pipefail

          TARGET="$WORKDIR/disk/steamOS-installed.img"

          echo "=============================================="
          echo "VERIFYING STEAMOS IMAGE"
          echo "=============================================="

          test -f "$TARGET"
          test "$(stat -c '%s' "$TARGET")" -gt 1000000000

          echo
          echo "Image:"
          qemu-img info "$TARGET"

          echo
          echo "GPT:"
          sgdisk -p "$TARGET"

          echo
          echo "Partition table:"
          fdisk -l "$TARGET" || true

          echo
          echo "SteamOS image passed basic validation."

      # ============================================================
      # COMPRESIÓN
      # ============================================================

      - name: Compress installed IMG
        if: ${{ inputs.compression }}
        shell: bash
        run: |
          set -euo pipefail

          TARGET="$WORKDIR/disk/steamOS-installed.img"
          OUTPUT="$WORKDIR/output/steamOS-installed.img.zst"

          echo "=============================================="
          echo "COMPRESSING"
          echo "=============================================="

          zstd \
            -T0 \
            -19 \
            --long=27 \
            --progress \
            "$TARGET" \
            -o "$OUTPUT"

          test -s "$OUTPUT"

          echo
          echo "Compressed image:"
          ls -lh "$OUTPUT"

      # ============================================================
      # COPIAR IMG SIN COMPRIMIR
      # ============================================================

      - name: Copy uncompressed IMG
        if: ${{ !inputs.compression }}
        shell: bash
        run: |
          set -euo pipefail

          cp \
            "$WORKDIR/disk/steamOS-installed.img" \
            "$WORKDIR/output/steamOS-installed.img"

          ls -lh "$WORKDIR/output/steamOS-installed.img"

      # ============================================================
      # METADATA
      # ============================================================

      - name: Create build metadata
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_NAME="$(cat "$WORKDIR/download/image-name.txt")"

          cat > "$WORKDIR/output/BUILD-INFO.txt" <<EOF
          SteamOS Automated VM Build

          Recovery image:
          $IMAGE_NAME

          Target disk:
          $DISK_SIZE

          Installation method:
          Valve SteamOS recovery environment
          QEMU/KVM
          NVMe virtual target

          Output:
          steamOS-installed.img

          This image contains the installed SteamOS filesystem
          and GPT partition table produced by the installer.

          IMPORTANT:
          Disable Secure Boot on hardware where SteamOS requires it.
          EOF

          cat "$WORKDIR/output/BUILD-INFO.txt"

      # ============================================================
      # SUBIR ARTIFACT
      # ============================================================

      - name: Upload installed SteamOS image
        uses: actions/upload-artifact@v4
        with:
          name: SteamOS-installed-image
          path: |
            /tmp/steamos-build/output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
