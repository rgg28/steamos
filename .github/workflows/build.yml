name: Build Installed SteamOS Image

on:
  workflow_dispatch:
    inputs:
      disk_size:
        description: "Tamaño del disco virtual"
        required: true
        default: "64G"
        type: string

      compression:
        description: "Comprimir IMG con zstd"
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Install SteamOS in QEMU
    runs-on: ubuntu-24.04

    timeout-minutes: 120

    env:
      WORKDIR: /tmp/steamos-build
      DISK_SIZE: ${{ inputs.disk_size }}

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # DEPENDENCIAS
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=============================================="

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            curl \
            wget \
            bzip2 \
            zstd \
            rsync \
            gdisk \
            util-linux \
            dosfstools \
            e2fsprogs \
            btrfs-progs \
            parted \
            pciutils \
            python3 \
            python3-pip \
            socat \
            xz-utils \
            ca-certificates

          qemu-system-x86_64 --version
          qemu-img --version

      # ==========================================================
      # DIRECTORIOS
      # ==========================================================

      - name: Create build directories
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf "$WORKDIR"

          mkdir -p \
            "$WORKDIR/download" \
            "$WORKDIR/recovery" \
            "$WORKDIR/disk" \
            "$WORKDIR/ovmf" \
            "$WORKDIR/logs" \
            "$WORKDIR/output" \
            "$WORKDIR/qmp"

      # ==========================================================
      # KVM
      # ==========================================================

      - name: Detect KVM
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "KVM DETECTION"
          echo "=============================================="

          KVM_OK=false

          if [[ -e /dev/kvm ]]; then
            echo "/dev/kvm exists:"
            ls -l /dev/kvm

            echo
            echo "Current user:"
            id

            echo
            echo "Testing KVM as root..."

            if sudo test -r /dev/kvm && sudo test -w /dev/kvm; then
              echo "KVM device is accessible through sudo."

              if sudo qemu-system-x86_64 \
                -enable-kvm \
                -machine q35 \
                -cpu host \
                -display none \
                -nodefaults \
                -S \
                -monitor none \
                -serial none \
                -no-reboot \
                >/tmp/kvm-test.log 2>&1 &
              then
                TEST_PID=$!

                sleep 3

                if kill -0 "$TEST_PID" 2>/dev/null; then
                  echo "KVM test succeeded."

                  sudo kill "$TEST_PID" 2>/dev/null || true
                  wait "$TEST_PID" 2>/dev/null || true

                  KVM_OK=true
                else
                  echo "QEMU exited during KVM test."
                  cat /tmp/kvm-test.log || true
                fi
              else
                echo "Could not start QEMU KVM test."
              fi
            else
              echo "Cannot access /dev/kvm through sudo."
            fi
          else
            echo "/dev/kvm does not exist."
          fi

          echo

          if [[ "$KVM_OK" == "true" ]]; then
            echo "=============================================="
            echo "ACCELERATION: KVM"
            echo "=============================================="

            echo "KVM" > "$WORKDIR/acceleration.txt"
          else
            echo "=============================================="
            echo "ACCELERATION: TCG"
            echo "=============================================="

            echo "KVM is unavailable."
            echo "Falling back to software virtualization."

            echo "TCG" > "$WORKDIR/acceleration.txt"
          fi

      # ==========================================================
      # STEAMOS RECOVERY INDEX
      # ==========================================================

      - name: Find latest SteamOS recovery image
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "STEAMOS RECOVERY"
          echo "=============================================="

          INDEX="https://steamdeck-images.steamos.cloud/recovery/"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 120 \
            "$INDEX" \
            -o "$WORKDIR/download/index.html"

          IMAGE_NAME="$(
            grep -oE \
              'steamdeck-oobe-repair-[0-9.]+-[0-9.]+\.img\.bz2' \
              "$WORKDIR/download/index.html" \
            | sort -V \
            | tail -1
          )"

          if [[ -z "$IMAGE_NAME" ]]; then
            echo "ERROR: Could not find SteamOS recovery image."
            exit 1
          fi

          IMAGE_URL="${INDEX}${IMAGE_NAME}"

          echo
          echo "Selected image:"
          echo "$IMAGE_NAME"

          echo
          echo "URL:"
          echo "$IMAGE_URL"

          printf '%s\n' "$IMAGE_NAME" \
            > "$WORKDIR/download/image-name.txt"

          printf '%s\n' "$IMAGE_URL" \
            > "$WORKDIR/download/image-url.txt"

      # ==========================================================
      # DOWNLOAD
      # ==========================================================

      - name: Download SteamOS recovery
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_NAME="$(cat "$WORKDIR/download/image-name.txt")"
          IMAGE_URL="$(cat "$WORKDIR/download/image-url.txt")"

          echo "Downloading:"
          echo "$IMAGE_NAME"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 3600 \
            --progress-bar \
            "$IMAGE_URL" \
            -o "$WORKDIR/download/$IMAGE_NAME"

          test -s "$WORKDIR/download/$IMAGE_NAME"

          ls -lh "$WORKDIR/download/$IMAGE_NAME"

      # ==========================================================
      # EXTRACT
      # ==========================================================

      - name: Extract recovery image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_NAME="$(cat "$WORKDIR/download/image-name.txt")"

          cp \
            "$WORKDIR/download/$IMAGE_NAME" \
            "$WORKDIR/recovery/$IMAGE_NAME"

          echo "Extracting..."

          bunzip2 -f \
            "$WORKDIR/recovery/$IMAGE_NAME"

          RECOVERY_NAME="${IMAGE_NAME%.bz2}"

          test -f "$WORKDIR/recovery/$RECOVERY_NAME"

          printf '%s\n' "$RECOVERY_NAME" \
            > "$WORKDIR/recovery/recovery-name.txt"

          echo
          echo "Recovery image:"
          ls -lh "$WORKDIR/recovery/$RECOVERY_NAME"

          echo
          qemu-img info \
            "$WORKDIR/recovery/$RECOVERY_NAME"

      # ==========================================================
      # OVMF
      # ==========================================================

      - name: Prepare UEFI
        shell: bash
        run: |
          set -euo pipefail

          CODE=""

          for f in \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            /usr/share/OVMF/OVMF_CODE.fd \
            /usr/share/qemu/OVMF_CODE.fd
          do
            if [[ -f "$f" ]]; then
              CODE="$f"
              break
            fi
          done

          if [[ -z "$CODE" ]]; then
            echo "ERROR: OVMF_CODE not found."
            exit 1
          fi

          VARS=""

          for f in \
            /usr/share/OVMF/OVMF_VARS_4M.fd \
            /usr/share/OVMF/OVMF_VARS.fd
          do
            if [[ -f "$f" ]]; then
              VARS="$f"
              break
            fi
          done

          if [[ -z "$VARS" ]]; then
            echo "ERROR: OVMF_VARS not found."
            exit 1
          fi

          cp "$CODE" \
            "$WORKDIR/ovmf/OVMF_CODE.fd"

          cp "$VARS" \
            "$WORKDIR/ovmf/OVMF_VARS.fd"

          echo "OVMF prepared."

      # ==========================================================
      # TARGET DISK
      # ==========================================================

      - name: Create target disk
        shell: bash
        run: |
          set -euo pipefail

          TARGET="$WORKDIR/disk/steamOS-installed.img"

          echo "=============================================="
          echo "TARGET DISK"
          echo "=============================================="

          echo "Size:"
          echo "$DISK_SIZE"

          qemu-img create \
            -f raw \
            "$TARGET" \
            "$DISK_SIZE"

          qemu-img info "$TARGET"

      # ==========================================================
      # QMP AUTOMATION SCRIPT
      # ==========================================================

      - name: Create QEMU automation script
        shell: bash
        run: |
          set -euo pipefail

          cat > "$WORKDIR/qmp/automate.py" <<'PY'
          import json
          import socket
          import sys
          import time

          QMP = sys.argv[1]

          # QEMU qcodes.
          SPECIAL = {
              " ": "spc",
              "\n": "ret",
              "\r": "ret",
              "-": "minus",
              ".": "dot",
              "/": "slash",
              ":": "semicolon",
              "_": "shift-minus",
              "=": "equal",
              "?": "shift-slash",
              "&": "shift-7",
              "%": "shift-5",
              "+": "shift-equal",
              "@": "shift-2",
              "#": "shift-3",
              "'": "apostrophe",
              '"': "shift-apostrophe",
              "!": "shift-1",
              "(": "shift-9",
              ")": "shift-0",
          }

          def qcode_for_char(c):
              if c in SPECIAL:
                  value = SPECIAL[c]

                  if value.startswith("shift-"):
                      return value.split("-", 1)[1], True

                  return value, False

              if "a" <= c <= "z":
                  return c, False

              if "A" <= c <= "Z":
                  return c.lower(), True

              if "0" <= c <= "9":
                  return c, False

              raise ValueError(f"Unsupported character: {repr(c)}")

          def command(sock, obj):
              payload = (json.dumps(obj) + "\r\n").encode()
              sock.sendall(payload)

              data = b""

              while b"\r\n" not in data:
                  chunk = sock.recv(65536)

                  if not chunk:
                      raise RuntimeError("QMP connection closed")

                  data += chunk

              return data

          def key(sock, qcode, down):
              obj = {
                  "execute": "input-send-event",
                  "arguments": {
                      "events": [
                          {
                              "type": "key",
                              "data": {
                                  "down": down,
                                  "key": {
                                      "type": "qcode",
                                      "data": qcode
                                  }
                              }
                          }
                      ]
                  }
              }

              command(sock, obj)

          def press(sock, qcode):
              key(sock, qcode, True)
              time.sleep(0.015)
              key(sock, qcode, False)
              time.sleep(0.015)

          def combo(sock, *keys):
              for k in keys:
                  key(sock, k, True)

              time.sleep(0.1)

              for k in reversed(keys):
                  key(sock, k, False)

              time.sleep(0.2)

          def type_text(sock, text):
              for c in text:
                  qcode, shift = qcode_for_char(c)

                  if shift:
                      key(sock, "shift", True)

                  press(sock, qcode)

                  if shift:
                      key(sock, "shift", False)

                  time.sleep(0.01)

          print("Waiting for QMP socket...")

          deadline = time.time() + 180

          sock = None

          while time.time() < deadline:
              try:
                  sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  sock.connect(QMP)
                  break
              except Exception:
                  if sock:
                      sock.close()

                  sock = None
                  time.sleep(1)

          if sock is None:
              raise RuntimeError("QMP socket did not appear")

          print("QMP connected.")

          # QEMU greeting.
          sock.recv(65536)

          command(
              sock,
              {
                  "execute": "qmp_capabilities"
              }
          )

          print("Waiting for SteamOS recovery desktop...")

          # Recovery needs time to boot KDE.
          time.sleep(120)

          print("Opening terminal with Ctrl+Alt+T...")

          combo(
              sock,
              "ctrl",
              "alt",
              "t"
          )

          time.sleep(5)

          # Use the custom installer maintained by louij2.
          #
          # It supports:
          # --disk
          # --yes
          # --no-zenity
          # --poweroff
          #
          # See:
          # https://github.com/louij2/steamos_custom_install
          #
          # The recovery environment already contains the SteamOS
          # installation tooling required by the installer.

          cmd = (
              "rm -rf /tmp/steamos_custom_install; "
              "curl -L --fail "
              "https://github.com/louij2/steamos_custom_install/archive/refs/heads/main.tar.gz "
              "-o /tmp/steamos.tar.gz; "
              "mkdir -p /tmp/steamos_custom_install; "
              "tar -xzf /tmp/steamos.tar.gz "
              "--strip-components=1 "
              "-C /tmp/steamos_custom_install; "
              "chmod +x /tmp/steamos_custom_install/repair_device.sh; "
              "sudo env NOPROMPT=1 NOZENITY=1 POWEROFF=1 "
              "/tmp/steamos_custom_install/repair_device.sh "
              "--disk /dev/nvme1n1 "
              "--yes "
              "--no-zenity "
              "--poweroff "
              "all"
          )

          print("Sending installation command...")

          type_text(sock, cmd)

          press(sock, "ret")

          print("Installation command sent.")

          # Do not send more keys.
          #
          # The installer is destructive and may take a long time.
          # It should shut down the VM when finished.
          #
          # We remain alive and monitor QMP.

          while True:
              time.sleep(10)

              try:
                  command(
                      sock,
                      {
                          "execute": "query-status"
                      }
                  )
              except Exception:
                  print("QEMU connection closed.")
                  break
          PY

          chmod +x "$WORKDIR/qmp/automate.py"

      # ==========================================================
      # START QEMU
      # ==========================================================

      - name: Start SteamOS VM
        shell: bash
        run: |
          set -euo pipefail

          RECOVERY_NAME="$(cat "$WORKDIR/recovery/recovery-name.txt")"

          RECOVERY="$WORKDIR/recovery/$RECOVERY_NAME"
          TARGET="$WORKDIR/disk/steamOS-installed.img"

          QMP="$WORKDIR/qmp/qmp.sock"

          ACCEL="$(cat "$WORKDIR/acceleration.txt")"

          rm -f "$QMP"

          echo "=============================================="
          echo "STARTING STEAMOS VM"
          echo "=============================================="

          echo "Acceleration:"
          echo "$ACCEL"

          QEMU_ACCEL=()

          if [[ "$ACCEL" == "KVM" ]]; then
            QEMU_ACCEL=(
              -enable-kvm
              -cpu host
            )
          else
            QEMU_ACCEL=(
              -accel tcg,thread=multi
              -cpu max
            )
          fi

          sudo qemu-system-x86_64 \
            "${QEMU_ACCEL[@]}" \
            -machine q35 \
            -smp 4 \
            -m 8192 \
            \
            -drive \
              if=pflash,format=raw,readonly=on \
              ,file="$WORKDIR/ovmf/OVMF_CODE.fd" \
            \
            -drive \
              if=pflash,format=raw \
              ,file="$WORKDIR/ovmf/OVMF_VARS.fd" \
            \
            -drive \
              id=recovery \
              ,if=none \
              ,format=raw \
              ,file="$RECOVERY" \
            \
            -device \
              nvme,drive=recovery,serial=RECOVERY0001 \
            \
            -drive \
              id=target \
              ,if=none \
              ,format=raw \
              ,file="$TARGET" \
            \
            -device \
              nvme,drive=target,serial=TARGET0001 \
            \
            -device \
              virtio-rng-pci \
            \
            -device \
              virtio-net-pci,netdev=net0 \
            \
            -netdev \
              user,id=net0 \
            \
            -device \
              virtio-vga \
            \
            -display \
              none \
            \
            -vnc \
              127.0.0.1:0 \
            \
            -qmp \
              unix:"$QMP",server=on,wait=off \
            \
            -serial \
              file:"$WORKDIR/logs/serial.log" \
            \
            -monitor \
              none \
            \
            -no-reboot \
            \
            > "$WORKDIR/logs/qemu.log" \
            2>&1 &

          QEMU_PID=$!

          echo "$QEMU_PID" \
            > "$WORKDIR/qemu.pid"

          echo "QEMU PID:"
          echo "$QEMU_PID"

          echo "QMP:"
          echo "$QMP"

      # ==========================================================
      # AUTOMATIZAR EL TERMINAL DEL RECOVERY
      # ==========================================================

      - name: Run unattended SteamOS installer
        shell: bash
        run: |
          set -euo pipefail

          QMP="$WORKDIR/qmp/qmp.sock"

          echo "Waiting for QEMU..."

          for i in $(seq 1 180); do
            if [[ -S "$QMP" ]]; then
              echo "QMP socket available."
              break
            fi

            sleep 1
          done

          if [[ ! -S "$QMP" ]]; then
            echo "ERROR: QMP socket never appeared."

            cat "$WORKDIR/logs/qemu.log" || true

            exit 1
          fi

          echo
          echo "Starting automated recovery installation."

          python3 \
            "$WORKDIR/qmp/automate.py" \
            "$QMP" \
            > "$WORKDIR/logs/automation.log" \
            2>&1 &

          AUTOMATION_PID=$!

          echo "$AUTOMATION_PID" \
            > "$WORKDIR/automation.pid"

          echo "Automation PID:"
          echo "$AUTOMATION_PID"

          # Wait for the installer process.
          #
          # The installer normally powers off the guest when finished.
          # Give it up to 75 minutes.

          for i in $(seq 1 450); do

            if [[ ! -e "$WORKDIR/qemu.pid" ]]; then
              break
            fi

            QPID="$(cat "$WORKDIR/qemu.pid")"

            if ! sudo kill -0 "$QPID" 2>/dev/null; then
              echo "QEMU has stopped."
              break
            fi

            if [[ -f "$WORKDIR/disk/steamOS-installed.img" ]]; then
              SIZE="$(stat -c '%s' "$WORKDIR/disk/steamOS-installed.img")"

              if [[ "$SIZE" -gt 1000000000 ]]; then
                echo "Target IMG exists."
              fi
            fi

            sleep 10
          done

          echo
          echo "Automation log:"
          cat "$WORKDIR/logs/automation.log" || true

          echo
          echo "QEMU log:"
          cat "$WORKDIR/logs/qemu.log" || true

      # ==========================================================
      # STOP VM IF NECESSARY
      # ==========================================================

      - name: Stop VM
        if: always()
        shell: bash
        run: |
          set +e

          if [[ -f "$WORKDIR/qemu.pid" ]]; then
            PID="$(cat "$WORKDIR/qemu.pid")"

            echo "Stopping QEMU PID $PID..."

            sudo kill "$PID" 2>/dev/null || true

            sleep 5

            sudo kill -9 "$PID" 2>/dev/null || true
          fi

      # ==========================================================
      # VALIDATE IMAGE
      # ==========================================================

      - name: Validate installed SteamOS image
        shell: bash
        run: |
          set -euo pipefail

          TARGET="$WORKDIR/disk/steamOS-installed.img"

          echo "=============================================="
          echo "VALIDATING FINAL IMAGE"
          echo "=============================================="

          if [[ ! -f "$TARGET" ]]; then
            echo "ERROR: SteamOS IMG was not created."
            exit 1
          fi

          SIZE="$(stat -c '%s' "$TARGET")"

          echo "IMG size:"
          numfmt --to=iec "$SIZE"

          if [[ "$SIZE" -lt 1000000000 ]]; then
            echo "ERROR: IMG is unexpectedly small."
            exit 1
          fi

          echo
          echo "QEMU image information:"

          qemu-img info "$TARGET"

          echo
          echo "GPT information:"

          if ! sudo sgdisk -p "$TARGET"; then
            echo "ERROR: final image has no readable GPT."
            exit 1
          fi

          echo
          echo "Partition table:"

          sudo fdisk -l "$TARGET" || true

          echo
          echo "SteamOS installation image looks valid."

      # ==========================================================
      # FINAL IMAGE
      # ==========================================================

      - name: Prepare uncompressed artifact
        shell: bash
        run: |
          set -euo pipefail

          cp \
            "$WORKDIR/disk/steamOS-installed.img" \
            "$WORKDIR/output/steamOS-installed.img"

          ls -lh \
            "$WORKDIR/output/steamOS-installed.img"

      # ==========================================================
      # COMPRESS
      # ==========================================================

      - name: Compress final IMG
        if: ${{ inputs.compression }}
        shell: bash
        run: |
          set -euo pipefail

          zstd \
            -T0 \
            -19 \
            --long=27 \
            --progress \
            "$WORKDIR/output/steamOS-installed.img" \
            -o "$WORKDIR/output/steamOS-installed.img.zst"

          rm \
            "$WORKDIR/output/steamOS-installed.img"

          ls -lh "$WORKDIR/output/"

      # ==========================================================
      # METADATA
      # ==========================================================

      - name: Write build information
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_NAME="$(cat "$WORKDIR/download/image-name.txt")"
          ACCEL="$(cat "$WORKDIR/acceleration.txt")"

          cat > "$WORKDIR/output/BUILD-INFO.txt" <<EOF
          SteamOS Installed Image
          =======================

          Recovery:
          $IMAGE_NAME

          Virtual disk:
          $DISK_SIZE

          QEMU acceleration:
          $ACCEL

          Installer:
          louij2/steamos_custom_install

          Target:
          /dev/nvme1n1

          Installation:
          Automated

          Output:
          SteamOS installed GPT image

          The image is intended to be written directly to a physical
          disk/SSD/USB device.

          IMPORTANT:
          This image was produced in a virtual machine. Hardware-specific
          Steam Deck firmware/controller updates were not intentionally
          applied to the target image.
          EOF

          cat "$WORKDIR/output/BUILD-INFO.txt"

      # ==========================================================
      # ARTIFACT
      # ==========================================================

      - name: Upload SteamOS image
        uses: actions/upload-artifact@v4
        with:
          name: SteamOS-installed-image
          path: |
            /tmp/steamos-build/output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # ==========================================================
      # LOGS SI FALLA
      # ==========================================================

      - name: Upload VM logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SteamOS-build-logs
          path: |
            /tmp/steamos-build/logs/*
            /tmp/steamos-build/download/image-name.txt
            /tmp/steamos-build/download/image-url.txt
            /tmp/steamos-build/acceleration.txt
          if-no-files-found: ignore
          retention-days: 7
