name: Build SteamOS Installed RAW\n\non:\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  build-steamos:\n    name: Build SteamOS RAW\n    runs-on: ubuntu-24.04\n    timeout-minutes: 360\n\n    env:\n      STEAMOS_VERSION: "20260416.1000"\n      STEAMOS_RELEASE: "3.9.0"\n      STEAMOS_URL: "https://steamdeck-images.steamos.cloud/steamdeck/20260416.1000/steamdeck-20260416.1000-3.9.0.img.zst"\n      IMAGE_SIZE: "64G"\n      WORKDIR: "/home/runner/steamos-build"\n\n    steps:\n\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Install dependencies\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          sudo apt-get update\n\n          sudo apt-get install -y \\n            zstd \\n            gdisk \\n            parted \\n            e2fsprogs \\n            dosfstools \\n            util-linux \\n            mount \\n            rsync \\n            file \\n            curl \\n            coreutils \\n            qemu-utils\n\n          mkdir -p "${WORKDIR}/downloads"\n          mkdir -p "${WORKDIR}/output"\n          mkdir -p "${WORKDIR}/mount"\n\n      - name: Download official SteamOS image\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          cd "${WORKDIR}/downloads"\n\n          curl \\n            --fail \\n            --location \\n            --retry 10 \\n            --retry-delay 5 \\n            --retry-all-errors \\n            --progress-bar \\n            -o steamos.img.zst \\n            "${STEAMOS_URL}"\n\n          ls -lh steamos.img.zst\n          file steamos.img.zst\n\n      - name: Decompress SteamOS image\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          cd "${WORKDIR}/downloads"\n\n          zstd \\n            -d \\n            --force \\n            steamos.img.zst \\n            -o steamos-source.img\n\n          ls -lh steamos-source.img\n          file steamos-source.img\n\n      - name: Inspect SteamOS image\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          echo "=============================================="\n          echo "STEAMOS GPT"\n          echo "=============================================="\n\n          sudo sgdisk -v "${WORKDIR}/downloads/steamos-source.img"\n          sudo sgdisk -p "${WORKDIR}/downloads/steamos-source.img"\n\n      - name: Validate SteamOS partition 8\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          IMG="${WORKDIR}/downloads/steamos-source.img"\n\n          if ! sudo sgdisk -i 8 "${IMG}" >/dev/null 2>&1; then\n            echo "ERROR: no existe la partición 8."\n            sudo sgdisk -p "${IMG}"\n            exit 1\n          fi\n\n          sudo sgdisk -i 8 "${IMG}"\n\n      - name: Create 64 GiB image\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          truncate \\n            -s "${IMAGE_SIZE}" \\n            "${WORKDIR}/output/SteamOS-installed.img"\n\n          ls -lh "${WORKDIR}/output/SteamOS-installed.img"\n\n      - name: Copy official SteamOS image\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          SOURCE="${WORKDIR}/downloads/steamos-source.img"\n          TARGET="${WORKDIR}/output/SteamOS-installed.img"\n\n          SOURCE_SIZE="$(stat -c '%s' "${SOURCE}")"\n          TARGET_SIZE="$(stat -c '%s' "${TARGET}")"\n\n          echo "SOURCE_SIZE=${SOURCE_SIZE}"\n          echo "TARGET_SIZE=${TARGET_SIZE}"\n\n          if [ "${SOURCE_SIZE}" -gt "${TARGET_SIZE}" ]; then\n            echo "ERROR: la imagen oficial es mayor que ${IMAGE_SIZE}."\n            exit 1\n          fi\n\n          dd \\n            if="${SOURCE}" \\n            of="${TARGET}" \\n            bs=64M \\n            conv=notrunc \\n            status=progress\n\n          sync\n\n      - name: Get HOME partition start\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          IMG="${WORKDIR}/output/SteamOS-installed.img"\n\n          HOME_START=$(sudo sgdisk -i 8 "${IMG}" | grep -i "First sector" | cut -d':' -f2 | awk '{print $1}')\n\n          if [ -z "${HOME_START}" ]; then\n            echo "ERROR: no se pudo obtener HOME_START."\n            exit 1\n          fi\n\n          echo "HOME_START=${HOME_START}"\n          echo "HOME_START=${HOME_START}" >> "${GITHUB_ENV}"\n\n      - name: Expand GPT\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          IMG="${WORKDIR}/output/SteamOS-installed.img"\n\n          sudo sgdisk -e "${IMG}"\n\n          sudo sgdisk -v "${IMG}"\n\n      - name: Get final sector\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          IMG="${WORKDIR}/output/SteamOS-installed.img"\n\n          LAST_SECTOR=$(sudo sgdisk -E "${IMG}" | tr -d '[:space:]')\n\n          if [ -z "${LAST_SECTOR}" ]; then\n            echo "ERROR: no se pudo obtener LAST_SECTOR."\n            exit 1\n          fi\n\n          echo "LAST_SECTOR=${LAST_SECTOR}"\n          echo "LAST_SECTOR=${LAST_SECTOR}" >> "${GITHUB_ENV}"\n\n      - name: Expand HOME partition\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          IMG="${WORKDIR}/output/SteamOS-installed.img"\n\n          echo "HOME_START=${HOME_START}"\n          echo "LAST_SECTOR=${LAST_SECTOR}"\n\n          sudo sgdisk \\n            -d 8 \\n            "${IMG}"\n\n          sudo sgdisk \\n            -n "8:${HOME_START}:${LAST_SECTOR}" \\n            -t "8:8300" \\n            "${IMG}"\n\n          sudo sgdisk \\n            -e \\n            "${IMG}"\n\n          sudo sgdisk -v "${IMG}"\n          sudo sgdisk -i 8 "${IMG}"\n\n      - name: Attach image\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          LOOP_DEVICE="$(\n            sudo losetup \\n              --find \\n              --show \\n              --partscan \\n              "${WORKDIR}/output/SteamOS-installed.img"\n          )"\n\n          echo "LOOP_DEVICE=${LOOP_DEVICE}"\n          echo "LOOP_DEVICE=${LOOP_DEVICE}" >> "${GITHUB_ENV}"\n\n          sleep 3\n\n          lsblk "${LOOP_DEVICE}"\n\n      - name: Detect HOME filesystem\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          FS_TYPE="$(\n            sudo blkid \\n              -o value \\n              -s TYPE \\n              "${LOOP_DEVICE}p8" \\n              || true\n          )"\n\n          echo "HOME filesystem: ${FS_TYPE}"\n          echo "FS_TYPE=${FS_TYPE}" >> "${GITHUB_ENV}"\n\n      - name: Expand HOME filesystem\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          if [ "${FS_TYPE}" = "ext4" ]; then\n\n            sudo e2fsck \\n              -f \\n              "${LOOP_DEVICE}p8"\n\n            sudo resize2fs \\n              "${LOOP_DEVICE}p8"\n\n          elif [ "${FS_TYPE}" = "btrfs" ]; then\n\n            echo "HOME usa Btrfs."\n            echo "La expansión al disco físico se hará en primer arranque."\n\n          else\n\n            echo "Filesystem HOME: ${FS_TYPE}"\n            echo "No se realizará resize destructivo."\n\n          fi\n\n      - name: Create first boot directory\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          rm -rf "${WORKDIR}/firstboot"\n\n          mkdir -p \\n            "${WORKDIR}/firstboot"\n\n      - name: Generate first boot script\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          python3 - "${WORKDIR}/firstboot/steamos-firstboot-grow.sh" <<'PY'\n          import sys\n\n          output = sys.argv[1]\n\n          script = r'''#!/usr/bin/env bash\n\n          set -u\n\n          LOG="/home/deck/steamos-firstboot-grow.log"\n\n          exec >> "${LOG}" 2>&1\n\n          echo "=============================================="\n          echo "SteamOS automatic disk expansion"\n          echo "=============================================="\n          date\n\n          ROOT_SOURCE="$(findmnt -n -o SOURCE /)"\n\n          echo "ROOT_SOURCE=${ROOT_SOURCE}"\n\n          case "${ROOT_SOURCE}" in\n              /dev/nvme*p*)\n                  DISK="${ROOT_SOURCE%p*}"\n                  HOME_PART="${DISK}p8"\n                  ;;\n              /dev/mmcblk*p*)\n                  DISK="${ROOT_SOURCE%p*}"\n                  HOME_PART="${DISK}p8"\n                  ;;\n              /dev/sd[a-z][0-9]*)\n                  DISK="${ROOT_SOURCE%%[0-9]*}"\n                  HOME_PART="${DISK}8"\n                  ;;\n              /dev/vd[a-z][0-9]*)\n                  DISK="${ROOT_SOURCE%%[0-9]*}"\n                  HOME_PART="${DISK}8"\n                  ;;\n              *)\n                  echo "No se pudo determinar el disco."\n                  exit 1\n                  ;;\n          esac\n\n          echo "DISK=${DISK}"\n          echo "HOME_PART=${HOME_PART}"\n\n          if [ ! -b "${DISK}" ]; then\n              echo "Disco no encontrado."\n              exit 1\n          fi\n\n          if [ ! -b "${HOME_PART}" ]; then\n              echo "HOME no encontrado."\n              exit 1\n          fi\n\n          if ! command -v sgdisk >/dev/null 2>&1; then\n              echo "sgdisk no está disponible."\n              exit 1\n          fi\n\n          HOME_START="$(\n              sgdisk -i 8 "${DISK}" |\n              awk -F: '\n                  /First sector/ {\n                      gsub(/[[:space:]]/, "", $2)\n                      print $2\n                  }\n              '\n          )"\n\n          if [ -z "${HOME_START}" ]; then\n              echo "No se pudo obtener HOME_START."\n              exit 1\n          fi\n\n          LAST_SECTOR="$(sgdisk -E "${DISK}")"\n\n          echo "HOME_START=${HOME_START}"\n          echo "LAST_SECTOR=${LAST_SECTOR}"\n\n          CURRENT_END="$(\n              sgdisk -i 8 "${DISK}" |\n              awk -F: '\n                  /Last sector/ {\n                      gsub(/[[:space:]]/, "", $2)\n                      print $2\n                  }\n              '\n          )"\n\n          echo "CURRENT_END=${CURRENT_END}"\n\n          if [ "${CURRENT_END}" -lt "${LAST_SECTOR}" ]; then\n\n              echo "Extending HOME partition..."\n\n              sgdisk \\n                  -d 8 \\n                  "${DISK}"\n\n              sgdisk \\n                  -n "8:${HOME_START}:${LAST_SECTOR}" \\n                  -t "8:8300" \\n                  "${DISK}"\n\n              sgdisk \\n                  -e \\n                  "${DISK}"\n\n              partprobe "${DISK}" || true\n\n              udevadm settle || true\n\n              sleep 5\n\n          else\n\n              echo "HOME ya ocupa todo el disco."\n\n          fi\n\n          FS_TYPE="$(\n              blkid \\n                  -o value \\n                  -s TYPE \\n                  "${HOME_PART}" \\n                  2>/dev/null \\n                  || true\n          )"\n\n          echo "FS_TYPE=${FS_TYPE}"\n\n          if [ "${FS_TYPE}" = "ext4" ]; then\n\n              e2fsck \\n                  -f \\n                  "${HOME_PART}" || true\n\n              resize2fs \\n                  "${HOME_PART}" || true\n\n          elif [ "${FS_TYPE}" = "btrfs" ]; then\n\n              mkdir -p /home\n\n              mountpoint -q /home || \\n                  mount "${HOME_PART}" /home || true\n\n              btrfs filesystem resize max /home || true\n\n          else\n\n              echo "Filesystem no soportado: ${FS_TYPE}"\n\n          fi\n\n          touch /home/deck/.steamos-firstboot-grow-complete\n\n          echo "Disk expansion completed."\n          date\n          '''\n\n          with open(output, "w", encoding="utf-8") as f:\n              f.write(script)\n\n          PY\n\n          chmod +x \\n            "${WORKDIR}/firstboot/steamos-firstboot-grow.sh"\n\n      - name: Generate first boot service\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          python3 - "${WORKDIR}/firstboot/steamos-firstboot-grow.service" <<'PY'\n          import sys\n\n          output = sys.argv[1]\n\n          service = """[Unit]\n          Description=SteamOS automatic first boot disk expansion\n          After=local-fs.target\n          Before=graphical.target\n          ConditionPathExists=!/home/deck/.steamos-firstboot-grow-complete\n\n          [Service]\n          Type=oneshot\n          ExecStart=/usr/local/sbin/steamos-firstboot-grow.sh\n          RemainAfterExit=yes\n          TimeoutStartSec=10min\n\n          [Install]\n          WantedBy=multi-user.target\n          """\n\n          with open(output, "w", encoding="utf-8") as f:\n              f.write(service)\n\n          PY\n\n      - name: Install first boot service into HOME\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          MOUNT="${WORKDIR}/mount/home"\n\n          sudo mkdir -p "${MOUNT}"\n\n          sudo mount \\n            "${LOOP_DEVICE}p8" \\n            "${MOUNT}"\n\n          sudo mkdir -p \\n            "${MOUNT}/.steamos-firstboot"\n\n          sudo cp \\n            "${WORKDIR}/firstboot/steamos-firstboot-grow.sh" \\n            "${MOUNT}/.steamos-firstboot/steamos-firstboot-grow.sh"\n\n          sudo chmod +x \\n            "${MOUNT}/.steamos-firstboot/steamos-firstboot-grow.sh"\n\n          sudo sync\n\n          sudo umount \\n            "${MOUNT}"\n\n      - name: Inspect SteamOS root partitions\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          sudo blkid \\n            "${LOOP_DEVICE}p4" \\n            "${LOOP_DEVICE}p5" \\n            "${LOOP_DEVICE}p6" \\n            "${LOOP_DEVICE}p7" \\n            "${LOOP_DEVICE}p8" \\n            || true\n\n      - name: Install automatic expansion service\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          ROOT_A="${LOOP_DEVICE}p4"\n          MOUNT="${WORKDIR}/mount/root-a"\n\n          sudo mkdir -p "${MOUNT}"\n\n          ROOT_TYPE="$(\n            sudo blkid \\n              -o value \\n              -s TYPE \\n              "${ROOT_A}" \\n              || true\n          )"\n\n          echo "ROOT-A filesystem: ${ROOT_TYPE}"\n\n          if [ "${ROOT_TYPE}" != "ext4" ] && [ "${ROOT_TYPE}" != "btrfs" ]; then\n            echo "ERROR: ROOT-A no es modificable como filesystem."\n            echo "La imagen de este release utiliza un formato incompatible con esta técnica."\n            exit 1\n          fi\n\n          sudo mount \\n            "${ROOT_A}" \\n            "${MOUNT}"\n\n          if [ ! -d "${MOUNT}/etc" ]; then\n            echo "ERROR: ROOT-A no contiene /etc."\n            sudo umount "${MOUNT}"\n            exit 1\n          fi\n\n          sudo mkdir -p \\n            "${MOUNT}/usr/local/sbin"\n\n          sudo mkdir -p \\n            "${MOUNT}/etc/systemd/system/multi-user.target.wants"\n\n          sudo cp \\n            "${WORKDIR}/firstboot/steamos-firstboot-grow.sh" \\n            "${MOUNT}/usr/local/sbin/steamos-firstboot-grow.sh"\n\n          sudo chmod +x \\n            "${MOUNT}/usr/local/sbin/steamos-firstboot-grow.sh"\n\n          sudo cp \\n            "${WORKDIR}/firstboot/steamos-firstboot-grow.service" \\n            "${MOUNT}/etc/systemd/system/steamos-firstboot-grow.service"\n\n          sudo ln -sf \\n            /etc/systemd/system/steamos-firstboot-grow.service \\n            "${MOUNT}/etc/systemd/system/multi-user.target.wants/steamos-firstboot-grow.service"\n\n          sudo sync\n\n          sudo umount \\n            "${MOUNT}"\n\n      - name: Detach image\n        if: always()\n        shell: bash\n        run: |\n          set +e\n\n          sudo umount \\n            "${WORKDIR}/mount/home" \\n            2>/dev/null || true\n\n          sudo umount \\n            "${WORKDIR}/mount/root-a" \\n            2>/dev/null || true\n\n          if [ -n "${LOOP_DEVICE:-}" ]; then\n            sudo losetup \\n              -d \\n              "${LOOP_DEVICE}" \\n              2>/dev/null || true\n          fi\n\n      - name: Verify final image\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          IMG="${WORKDIR}/output/SteamOS-installed.img"\n\n          echo "=============================================="\n          echo "FINAL STEAMOS IMAGE"\n          echo "=============================================="\n\n          ls -lh "${IMG}"\n\n          echo\n          echo "GPT verification:"\n\n          sudo sgdisk \\n            -v \\n            "${IMG}"\n\n          echo\n          sudo sgdisk \\n            -p \\n            "${IMG}"\n\n          echo\n          echo "HOME partition:"\n\n          sudo sgdisk \\n            -i 8 \\n            "${IMG}"\n\n      - name: Generate SHA256\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          cd "${WORKDIR}/output"\n\n          sha256sum \\n            SteamOS-installed.img \\n            > SteamOS-installed.img.sha256\n\n          cat SteamOS-installed.img.sha256\n\n      - name: Compress RAW\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          cd "${WORKDIR}/output"\n\n          zstd \\n            -T0 \\n            -19 \\n            --long=27 \\n            SteamOS-installed.img \\n            -o SteamOS-installed.img.zst\n\n          ls -lh \\n            SteamOS-installed.img \\n            SteamOS-installed.img.zst\n\n      - name: Split compressed image\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          cd "${WORKDIR}/output"\n\n          split \\n            -b 1900M \\n            -d \\n            -a 3 \\n            SteamOS-installed.img.zst \\n            SteamOS-installed.img.zst.part-\n\n          ls -lh \\n            SteamOS-installed.img.zst.part-*\n\n      - name: Create Windows reconstruction script\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          cd "${WORKDIR}/output"\n\n          python3 - "JOIN-WINDOWS.ps1" <<'PY'\n          import sys\n\n          output = sys.argv[1]\n\n          script = r"""$ErrorActionPreference = "Stop"\n\n          $output = "SteamOS-installed.img.zst"\n\n          if (Test-Path $output) {\n              Remove-Item $output -Force\n          }\n\n          $parts = Get-ChildItem `\n              -File `\n              "SteamOS-installed.img.zst.part-*" |\n              Sort-Object Name\n\n          if ($parts.Count -eq 0) {\n              throw "No se encontraron partes."\n          }\n\n          $destination = [System.IO.File]::Open(\n              $output,\n              [System.IO.FileMode]::Create,\n              [System.IO.FileAccess]::Write\n          )\n\n          try {\n              foreach ($part in $parts) {\n\n                  Write-Host "Agregando $($part.Name)..."\n\n                  $source = [System.IO.File]::OpenRead(\n                      $part.FullName\n                  )\n\n                  try {\n                      $buffer = New-Object byte[] 1048576\n\n                      while (\n                          ($read = $source.Read(\n                              $buffer,\n                              0,\n                              $buffer.Length\n                          )) -gt 0\n                      ) {\n                          $destination.Write(\n                              $buffer,\n                              0,\n                              $read\n                          )\n                      }\n                  }\n                  finally {\n                      $source.Dispose()\n                  }\n              }\n          }\n          finally {\n              $destination.Dispose()\n          }\n\n          Write-Host ""\n          Write-Host "Imagen reconstruida:"\n          Get-Item $output\n\n          Write-Host ""\n          Write-Host "Descomprimir con:"\n          Write-Host "zstd -d SteamOS-installed.img.zst -o SteamOS-installed.img"\n          """\n\n          with open(output, "w", encoding="utf-8") as f:\n              f.write(script)\n\n          PY\n\n      - name: Create build info\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          cd "${WORKDIR}/output"\n\n          cat > BUILD-INFO.txt <<EOF\n          SteamOS Installed RAW\n          =====================\n\n          Valve release:\n          ${STEAMOS_VERSION}\n\n          SteamOS release:\n          ${STEAMOS_RELEASE}\n\n          Official source:\n          ${STEAMOS_URL}\n\n          Base image size:\n          ${IMAGE_SIZE}\n\n          Output:\n          SteamOS-installed.img\n\n          Automatic first-boot expansion:\n          ENABLED\n\n          First boot:\n          - Detect physical disk\n          - Move backup GPT to disk end\n          - Extend partition 8\n          - Grow filesystem\n          - Create completion marker\n\n          SHA256:\n          \$(cat SteamOS-installed.img.sha256)\n          EOF\n          \n          cat BUILD-INFO.txt\n\n      - name: Upload SteamOS artifacts\n        uses: actions/upload-artifact@v4\n        with:\n          name: SteamOS-installed-\${{ env.STEAMOS_VERSION }}-\${{ env.STEAMOS_RELEASE }}\n          compression-level: 0\n          if-no-files-found: error\n          path: |\n            /home/runner/steamos-build/output/SteamOS-installed.img.zst.part-*\n            /home/runner/steamos-build/output/SteamOS-installed.img.sha256\n            /home/runner/steamos-build/output/BUILD-INFO.txt\n            /home/runner/steamos-build/output/JOIN-WINDOWS.ps1\n\n      - name: Final summary\n        shell: bash\n        run: |\n          set -euxo pipefail\n\n          echo\n          echo "=============================================="\n          echo "STEAMOS BUILD COMPLETED"\n          echo "=============================================="\n          \n          ls -lh \\n            "${WORKDIR}/output"\n          \n          echo\n          echo "SHA256:"\n          cat \\n            "${WORKDIR}/output/SteamOS-installed.img.sha256"