name: Build SteamOS Installed RAW

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-steamos:
    name: Build SteamOS Installed RAW
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      STEAMOS_VERSION: "20260416.1000"
      STEAMOS_RELEASE: "3.9.0"

      STEAMOS_URL: "https://steamdeck-images.steamos.cloud/steamdeck/20260416.1000/steamdeck-20260416.1000-3.9.0.img.zst"

      # Imagen base que construiremos.
      BASE_IMAGE: "/home/runner/steamos-build/downloads/steamos-source.img"

      # Resultado.
      FINAL_IMAGE: "/home/runner/steamos-build/output/SteamOS-installed.img"

      # Tamaño inicial de la imagen.
      # Se puede flashear después a discos mayores.
      IMAGE_SIZE: "64G"

      WORKDIR: "/home/runner/steamos-build"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIAS
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            zstd \
            gdisk \
            parted \
            e2fsprogs \
            dosfstools \
            util-linux \
            mount \
            rsync \
            file \
            curl \
            coreutils \
            qemu-utils \
            kpartx \
            systemd-container

          mkdir -p "${WORKDIR}/downloads"
          mkdir -p "${WORKDIR}/output"
          mkdir -p "${WORKDIR}/mount"

      # ============================================================
      # DESCARGAR STEAMOS OFICIAL
      # ============================================================

      - name: Download official SteamOS image
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKDIR}/downloads"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            --progress-bar \
            -o steamos.img.zst \
            "${STEAMOS_URL}"

          echo
          echo "Imagen descargada:"
          ls -lh steamos.img.zst

          file steamos.img.zst

      # ============================================================
      # DESCOMPRIMIR
      # ============================================================

      - name: Decompress SteamOS image
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKDIR}/downloads"

          zstd \
            -d \
            --force \
            steamos.img.zst \
            -o steamos-source.img

          echo
          echo "Imagen RAW:"
          ls -lh steamos-source.img

          file steamos-source.img

      # ============================================================
      # INSPECCIONAR GPT
      # ============================================================

      - name: Inspect SteamOS GPT
        shell: bash
        run: |
          set -euxo pipefail

          sudo sgdisk -v "${BASE_IMAGE}"

          echo
          echo "=============================================="
          echo "STEAMOS PARTITIONS"
          echo "=============================================="

          sudo sgdisk -p "${BASE_IMAGE}"

      # ============================================================
      # OBTENER INFORMACIÓN DE HOME
      # ============================================================

      - name: Detect SteamOS HOME partition
        shell: bash
        run: |
          set -euxo pipefail

          HOME_INFO="$(
            sudo sgdisk -i 8 "${BASE_IMAGE}"
          )"

          echo "${HOME_INFO}"

          HOME_START="$(
            echo "${HOME_INFO}" |
            awk -F: '
              /First sector/ {
                gsub(/[[:space:]]/, "", $2)
                print $2
              }
            '
          )"

          HOME_END="$(
            echo "${HOME_INFO}" |
            awk -F: '
              /Last sector/ {
                gsub(/[[:space:]]/, "", $2)
                print $2
              }
            '
          )"

          if [ -z "${HOME_START}" ]; then
            echo "ERROR: no se pudo obtener el inicio de HOME."
            exit 1
          fi

          if [ -z "${HOME_END}" ]; then
            echo "ERROR: no se pudo obtener el final de HOME."
            exit 1
          fi

          echo "HOME_START=${HOME_START}"
          echo "HOME_END=${HOME_END}"

          echo "HOME_START=${HOME_START}" >> "${GITHUB_ENV}"
          echo "HOME_END=${HOME_END}" >> "${GITHUB_ENV}"

      # ============================================================
      # CREAR IMAGEN FINAL
      # ============================================================

      - name: Create final 64 GiB RAW
        shell: bash
        run: |
          set -euxo pipefail

          rm -f "${FINAL_IMAGE}"

          truncate \
            -s "${IMAGE_SIZE}" \
            "${FINAL_IMAGE}"

          ls -lh "${FINAL_IMAGE}"

      # ============================================================
      # COPIAR IMAGEN OFICIAL
      # ============================================================

      - name: Copy official SteamOS image
        shell: bash
        run: |
          set -euxo pipefail

          SOURCE_SIZE="$(
            stat -c '%s' "${BASE_IMAGE}"
          )"

          TARGET_SIZE="$(
            stat -c '%s' "${FINAL_IMAGE}"
          )"

          echo "SOURCE_SIZE=${SOURCE_SIZE}"
          echo "TARGET_SIZE=${TARGET_SIZE}"

          if [ "${SOURCE_SIZE}" -gt "${TARGET_SIZE}" ]; then
            echo "ERROR: la imagen base es mayor que ${IMAGE_SIZE}."
            exit 1
          fi

          dd \
            if="${BASE_IMAGE}" \
            of="${FINAL_IMAGE}" \
            bs=64M \
            conv=notrunc \
            status=progress

          sync

      # ============================================================
      # EXPANDIR GPT
      # ============================================================

      - name: Expand GPT
        shell: bash
        run: |
          set -euxo pipefail

          echo "Moviendo GPT secundaria al final..."

          sudo sgdisk \
            -e \
            "${FINAL_IMAGE}"

          echo
          sudo sgdisk -v "${FINAL_IMAGE}"

      # ============================================================
      # CALCULAR ÚLTIMO SECTOR
      # ============================================================

      - name: Calculate image last sector
        shell: bash
        run: |
          set -euxo pipefail

          LAST_SECTOR="$(
            sudo sgdisk -E "${FINAL_IMAGE}"
          )"

          if [ -z "${LAST_SECTOR}" ]; then
            echo "ERROR: no se pudo determinar el último sector."
            exit 1
          fi

          echo "LAST_SECTOR=${LAST_SECTOR}"
          echo "LAST_SECTOR=${LAST_SECTOR}" >> "${GITHUB_ENV}"

      # ============================================================
      # EXTENDER PARTICIÓN 8
      # ============================================================

      - name: Expand HOME partition to image end
        shell: bash
        run: |
          set -euxo pipefail

          echo "HOME_START=${HOME_START}"
          echo "LAST_SECTOR=${LAST_SECTOR}"

          sudo sgdisk \
            -d 8 \
            "${FINAL_IMAGE}"

          sudo sgdisk \
            -n "8:${HOME_START}:${LAST_SECTOR}" \
            -t "8:8300" \
            "${FINAL_IMAGE}"

          sudo sgdisk \
            -e \
            "${FINAL_IMAGE}"

          sync

      # ============================================================
      # VERIFICAR GPT
      # ============================================================

      - name: Verify expanded GPT
        shell: bash
        run: |
          set -euxo pipefail

          sudo sgdisk -v "${FINAL_IMAGE}"

          echo
          sudo sgdisk -p "${FINAL_IMAGE}"

          echo
          sudo sgdisk -i 8 "${FINAL_IMAGE}"

      # ============================================================
      # OBTENER OFFSETS
      # ============================================================

      - name: Calculate partition offsets
        shell: bash
        run: |
          set -euxo pipefail

          PART8_START="$(
            sudo sgdisk -i 8 "${FINAL_IMAGE}" |
            awk -F: '
              /First sector/ {
                gsub(/[[:space:]]/, "", $2)
                print $2
              }
            '
          )"

          PART8_END="$(
            sudo sgdisk -i 8 "${FINAL_IMAGE}" |
            awk -F: '
              /Last sector/ {
                gsub(/[[:space:]]/, "", $2)
                print $2
              }
            '
          )"

          SECTOR_SIZE=512

          PART8_OFFSET=$((PART8_START * SECTOR_SIZE))
          PART8_BYTES=$(((PART8_END - PART8_START + 1) * SECTOR_SIZE))

          echo "PART8_START=${PART8_START}"
          echo "PART8_END=${PART8_END}"
          echo "PART8_OFFSET=${PART8_OFFSET}"
          echo "PART8_BYTES=${PART8_BYTES}"

          echo "PART8_START=${PART8_START}" >> "${GITHUB_ENV}"
          echo "PART8_END=${PART8_END}" >> "${GITHUB_ENV}"
          echo "PART8_OFFSET=${PART8_OFFSET}" >> "${GITHUB_ENV}"
          echo "PART8_BYTES=${PART8_BYTES}" >> "${GITHUB_ENV}"

      # ============================================================
      # CONECTAR IMAGEN COMO LOOP DEVICE
      # ============================================================

      - name: Attach final image
        shell: bash
        run: |
          set -euxo pipefail

          LOOP_DEVICE="$(
            sudo losetup \
              --find \
              --show \
              --partscan \
              "${FINAL_IMAGE}"
          )"

          echo "LOOP_DEVICE=${LOOP_DEVICE}"
          echo "LOOP_DEVICE=${LOOP_DEVICE}" >> "${GITHUB_ENV}"

          sleep 3

          lsblk "${LOOP_DEVICE}"

      # ============================================================
      # COMPROBAR HOME
      # ============================================================

      - name: Inspect HOME filesystem
        shell: bash
        run: |
          set -euxo pipefail

          echo "Partición:"
          lsblk -o NAME,SIZE,FSTYPE,LABEL,PARTUUID "${LOOP_DEVICE}"

          echo
          echo "Partición 8:"
          sudo blkid "${LOOP_DEVICE}p8" || true

      # ============================================================
      # RESIZE DEL FILESYSTEM
      #
      # IMPORTANTE:
      #
      # Primero hacemos que el filesystem ocupe la nueva partición.
      # Si el filesystem no es ext4, el workflow falla.
      #
      # Esto nos da una imagen que ya ocupa todo su disco base de
      # 64 GiB.
      # ============================================================

      - name: Expand HOME filesystem
        shell: bash
        run: |
          set -euxo pipefail

          FS_TYPE="$(
            sudo blkid \
              -o value \
              -s TYPE \
              "${LOOP_DEVICE}p8" \
              || true
          )"

          echo "Filesystem HOME: ${FS_TYPE}"

          if [ "${FS_TYPE}" = "ext4" ]; then

            sudo e2fsck \
              -f \
              "${LOOP_DEVICE}p8"

            sudo resize2fs \
              "${LOOP_DEVICE}p8"

          elif [ "${FS_TYPE}" = "btrfs" ]; then

            echo "HOME usa Btrfs."
            echo "La expansión final se realizará en el primer arranque."

          else

            echo "Filesystem desconocido: ${FS_TYPE}"
            echo "No se modificará destructivamente."
          fi

      # ============================================================
      # CREAR SCRIPT DE PRIMER ARRANQUE
      #
      # Este script NO asume que el disco físico sea de 64 GiB.
      #
      # En el primer arranque:
      #
      #   1. detecta el disco raíz
      #   2. mueve GPT al final
      #   3. detecta HOME
      #   4. extiende HOME
      #   5. crece el filesystem
      #   6. se deshabilita
      #
      # ============================================================

      - name: Create first boot expansion script
        shell: bash
        run: |
          set -euxo pipefail

          FIRST_BOOT_DIR="${WORKDIR}/firstboot"

          rm -rf "${FIRST_BOOT_DIR}"
          mkdir -p "${FIRST_BOOT_DIR}"

          cat > "${FIRST_BOOT_DIR}/steamos-firstboot-grow.sh" <<'EOF'
#!/usr/bin/env bash

set -u

LOG="/home/deck/steamos-firstboot-grow.log"

exec >> "${LOG}" 2>&1

echo
echo "=============================================="
echo "SteamOS first boot disk expansion"
echo "=============================================="
date

# ------------------------------------------------------------
# ROOT DEVICE
# ------------------------------------------------------------

ROOT_SOURCE="$(
    findmnt \
        -n \
        -o SOURCE \
        /
)

echo "ROOT_SOURCE=${ROOT_SOURCE}"

# ------------------------------------------------------------
# DETECT WHOLE DISK
# ------------------------------------------------------------

case "${ROOT_SOURCE}" in

    /dev/nvme*p*)
        DISK="${ROOT_SOURCE%p*}"
        ;;

    /dev/mmcblk*p*)
        DISK="${ROOT_SOURCE%p*}"
        ;;

    /dev/sd[a-z][0-9]*)
        DISK="${ROOT_SOURCE%%[0-9]*}"
        ;;

    *)
        echo "No se pudo determinar el disco."
        exit 1
        ;;

esac

echo "DISK=${DISK}"

if [ ! -b "${DISK}" ]; then
    echo "Disco no encontrado."
    exit 1
fi

# ------------------------------------------------------------
# INSTALAR HERRAMIENTAS SI ESTÁN DISPONIBLES
# ------------------------------------------------------------

command -v sgdisk >/dev/null 2>&1 || {
    echo "sgdisk no está disponible."
    exit 1
}

# ------------------------------------------------------------
# MOVER BACKUP GPT
# ------------------------------------------------------------

echo "Moviendo GPT..."

sgdisk \
    -e \
    "${DISK}" || exit 1

# ------------------------------------------------------------
# ENCONTRAR HOME
#
# SteamOS usa la partición 8 como HOME.
# ------------------------------------------------------------

HOME_PART="${DISK}p8"

if [ ! -b "${HOME_PART}" ]; then

    case "${DISK}" in
        /dev/sd*)
            HOME_PART="${DISK}8"
            ;;
        /dev/vd*)
            HOME_PART="${DISK}8"
            ;;
        *)
            echo "No se encontró HOME."
            exit 1
            ;;
    esac

fi

echo "HOME_PART=${HOME_PART}"

# ------------------------------------------------------------
# OBTENER INICIO
# ------------------------------------------------------------

HOME_START="$(
    sgdisk -i 8 "${DISK}" |
    awk -F: '
        /First sector/ {
            gsub(/[[:space:]]/, "", $2)
            print $2
        }
    '
)

if [ -z "${HOME_START}" ]; then
    echo "No se pudo determinar HOME_START."
    exit 1
fi

echo "HOME_START=${HOME_START}"

# ------------------------------------------------------------
# ÚLTIMO SECTOR
# ------------------------------------------------------------

LAST_SECTOR="$(
    sgdisk -E "${DISK}"
)

echo "LAST_SECTOR=${LAST_SECTOR}"

if [ -z "${LAST_SECTOR}" ]; then
    echo "No se pudo determinar LAST_SECTOR."
    exit 1
fi

# ------------------------------------------------------------
# OBTENER TIPO DE FILESYSTEM
# ------------------------------------------------------------

FS_TYPE="$(
    blkid \
        -o value \
        -s TYPE \
        "${HOME_PART}" \
        2>/dev/null \
        || true
)

echo "FS_TYPE=${FS_TYPE}"

# ------------------------------------------------------------
# COMPROBAR SI YA OCUPA TODO
# ------------------------------------------------------------

CURRENT_END="$(
    sgdisk -i 8 "${DISK}" |
    awk -F: '
        /Last sector/ {
            gsub(/[[:space:]]/, "", $2)
            print $2
        }
    '
)"

echo "CURRENT_END=${CURRENT_END}"

if [ "${CURRENT_END}" -lt "${LAST_SECTOR}" ]; then

    echo "Extendiendo partición 8..."

    sgdisk \
        -d 8 \
        "${DISK}" || exit 1

    sgdisk \
        -n "8:${HOME_START}:${LAST_SECTOR}" \
        -t "8:8300" \
        "${DISK}" || exit 1

    sgdisk \
        -e \
        "${DISK}" || exit 1

    partprobe "${DISK}" || true

    udevadm settle || true

    sleep 3

fi

# ------------------------------------------------------------
# CRECER FILESYSTEM
# ------------------------------------------------------------

if [ "${FS_TYPE}" = "ext4" ]; then

    echo "Creciendo ext4..."

    e2fsck \
        -f \
        "${HOME_PART}" || true

    resize2fs \
        "${HOME_PART}" || true

elif [ "${FS_TYPE}" = "btrfs" ]; then

    echo "Creciendo Btrfs..."

    mountpoint -q /home || {
        mount "${HOME_PART}" /home || true
    }

    btrfs filesystem resize max /home || true

else

    echo "Filesystem no soportado automáticamente: ${FS_TYPE}"

fi

# ------------------------------------------------------------
# MARCAR COMO COMPLETADO
# ------------------------------------------------------------

touch /home/deck/.steamos-firstboot-grow-complete

echo
echo "Expansión completada."
date

exit 0
EOF

          chmod +x \
            "${FIRST_BOOT_DIR}/steamos-firstboot-grow.sh"

      # ============================================================
      # CREAR UNIDAD SYSTEMD
      # ============================================================

      - name: Create first boot systemd unit
        shell: bash
        run: |
          set -euxo pipefail

          FIRST_BOOT_DIR="${WORKDIR}/firstboot"

          cat > "${FIRST_BOOT_DIR}/steamos-firstboot-grow.service" <<'EOF'
[Unit]
Description=SteamOS automatic first boot disk expansion
After=local-fs.target
Before=graphical.target

ConditionPathExists=!/home/deck/.steamos-firstboot-grow-complete

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/steamos-firstboot-grow.sh
RemainAfterExit=yes
TimeoutStartSec=10min

[Install]
WantedBy=multi-user.target
EOF

      # ============================================================
      # COPIAR SCRIPT A HOME
      # ============================================================

      - name: Install first boot files
        shell: bash
        run: |
          set -euxo pipefail

          LOOP="${LOOP_DEVICE}"

          # Montar HOME.
          sudo mkdir -p "${WORKDIR}/mount/home"

          sudo mount \
            "${LOOP}p8" \
            "${WORKDIR}/mount/home"

          echo "HOME montado."

          sudo mkdir -p \
            "${WORKDIR}/mount/home/.steamos-firstboot"

          sudo cp \
            "${WORKDIR}/firstboot/steamos-firstboot-grow.sh" \
            "${WORKDIR}/mount/home/.steamos-firstboot/"

          sudo chmod +x \
            "${WORKDIR}/mount/home/.steamos-firstboot/steamos-firstboot-grow.sh"

          sudo sync

          sudo umount \
            "${WORKDIR}/mount/home"

      # ============================================================
      # PREPARAR ROOTFS PARA EL SERVICIO
      #
      # Intentamos localizar el rootfs-A y modificar solamente la
      # capa persistente necesaria para ejecutar el servicio.
      # ============================================================

      - name: Inspect root filesystems
        shell: bash
        run: |
          set -euxo pipefail

          echo "Particiones root:"

          sudo sgdisk -p "${FINAL_IMAGE}" |
            grep -E '^[[:space:]]*[45][[:space:]]' || true

          echo
          echo "Filesystem types:"

          sudo blkid \
            "${LOOP_DEVICE}p4" \
            "${LOOP_DEVICE}p5" \
            "${LOOP_DEVICE}p6" \
            "${LOOP_DEVICE}p7" \
            "${LOOP_DEVICE}p8" \
            || true

      # ============================================================
      # INTENTAR MONTAR ROOT-A
      # ============================================================

      - name: Install systemd first boot service
        shell: bash
        run: |
          set -euxo pipefail

          ROOT_A="${LOOP_DEVICE}p4"

          sudo mkdir -p \
            "${WORKDIR}/mount/root-a"

          ROOT_TYPE="$(
            sudo blkid \
              -o value \
              -s TYPE \
              "${ROOT_A}" \
              || true
          )"

          echo "ROOT-A filesystem: ${ROOT_TYPE}"

          if [ "${ROOT_TYPE}" != "ext4" ] && [ "${ROOT_TYPE}" != "btrfs" ]; then
            echo
            echo "ROOT-A no es un filesystem modificable directamente."
            echo
            echo "Esto es esperado en algunas imágenes SteamOS."
            echo "La imagen no será marcada como completamente automática."
            exit 1
          fi

          sudo mount \
            "${ROOT_A}" \
            "${WORKDIR}/mount/root-a"

          # Verificar que realmente sea un rootfs.
          if [ ! -d "${WORKDIR}/mount/root-a/etc" ]; then
            echo "ERROR: ROOT-A no contiene /etc."
            sudo umount "${WORKDIR}/mount/root-a"
            exit 1
          fi

          sudo mkdir -p \
            "${WORKDIR}/mount/root-a/usr/local/sbin"

          sudo mkdir -p \
            "${WORKDIR}/mount/root-a/etc/systemd/system"

          sudo cp \
            "${WORKDIR}/firstboot/steamos-firstboot-grow.sh" \
            "${WORKDIR}/mount/root-a/usr/local/sbin/steamos-firstboot-grow.sh"

          sudo chmod +x \
            "${WORKDIR}/mount/root-a/usr/local/sbin/steamos-firstboot-grow.sh"

          sudo cp \
            "${WORKDIR}/firstboot/steamos-firstboot-grow.service" \
            "${WORKDIR}/mount/root-a/etc/systemd/system/steamos-firstboot-grow.service"

          # Habilitar servicio.
          sudo mkdir -p \
            "${WORKDIR}/mount/root-a/etc/systemd/system/multi-user.target.wants"

          sudo ln -sf \
            /etc/systemd/system/steamos-firstboot-grow.service \
            "${WORKDIR}/mount/root-a/etc/systemd/system/multi-user.target.wants/steamos-firstboot-grow.service"

          sudo sync

          sudo umount \
            "${WORKDIR}/mount/root-a"

      # ============================================================
      # LIMPIEZA LOOP
      # ============================================================

      - name: Detach image
        if: always()
        shell: bash
        run: |
          set +e

          if [ -n "${LOOP_DEVICE:-}" ]; then
            sudo umount \
              "${WORKDIR}/mount/home" \
              2>/dev/null || true

            sudo umount \
              "${WORKDIR}/mount/root-a" \
              2>/dev/null || true

            sudo losetup \
              -d \
              "${LOOP_DEVICE}" \
              2>/dev/null || true
          fi

      # ============================================================
      # VERIFICACIÓN FINAL
      # ============================================================

      - name: Final image verification
        shell: bash
        run: |
          set -euxo pipefail

          echo "=============================================="
          echo "FINAL IMAGE"
          echo "=============================================="

          ls -lh "${FINAL_IMAGE}"

          echo
          echo "GPT:"
          sudo sgdisk -v "${FINAL_IMAGE}"

          echo
          sudo sgdisk -p "${FINAL_IMAGE}"

          echo
          echo "HOME:"
          sudo sgdisk -i 8 "${FINAL_IMAGE}"

      # ============================================================
      # SHA256
      # ============================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKDIR}/output"

          sha256sum \
            SteamOS-installed.img \
            > SteamOS-installed.img.sha256

          cat SteamOS-installed.img.sha256

      # ============================================================
      # COMPRIMIR
      # ============================================================

      - name: Compress RAW
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKDIR}/output"

          zstd \
            -T0 \
            -19 \
            --long=27 \
            SteamOS-installed.img \
            -o SteamOS-installed.img.zst

          ls -lh \
            SteamOS-installed.img \
            SteamOS-installed.img.zst

      # ============================================================
      # DIVIDIR
      # ============================================================

      - name: Split image
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKDIR}/output"

          split \
            -b 1900M \
            -d \
            -a 3 \
            SteamOS-installed.img.zst \
            SteamOS-installed.img.zst.part-

          ls -lh \
            SteamOS-installed.img.zst.part-*

      # ============================================================
      # SCRIPT WINDOWS
      # ============================================================

      - name: Create Windows JOIN script
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKDIR}/output"

          cat > JOIN-WINDOWS.ps1 <<'EOF'
$ErrorActionPreference = "Stop"

$output = "SteamOS-installed.img.zst"

if (Test-Path $output) {
    Remove-Item $output -Force
}

$parts = Get-ChildItem `
    -File `
    "SteamOS-installed.img.zst.part-*" |
    Sort-Object Name

if ($parts.Count -eq 0) {
    throw "No se encontraron partes."
}

$destination = [System.IO.File]::Open(
    $output,
    [System.IO.FileMode]::Create,
    [System.IO.FileAccess]::Write
)

try {

    foreach ($part in $parts) {

        Write-Host "Agregando $($part.Name)..."

        $source = [System.IO.File]::OpenRead(
            $part.FullName
        )

        try {

            $buffer = New-Object byte[] 1048576

            while (
                ($read = $source.Read(
                    $buffer,
                    0,
                    $buffer.Length
                )) -gt 0
            ) {
                $destination.Write(
                    $buffer,
                    0,
                    $read
                )
            }

        }
        finally {
            $source.Dispose()
        }
    }

}
finally {
    $destination.Dispose()
}

Write-Host ""
Write-Host "Creado:"
Get-Item $output

Write-Host ""
Write-Host "Descomprimir:"
Write-Host "zstd -d SteamOS-installed.img.zst -o SteamOS-installed.img"
EOF

      # ============================================================
      # INFO
      # ============================================================

      - name: Create BUILD-INFO
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WORKDIR}/output"

          cat > BUILD-INFO.txt <<EOF
SteamOS Installed RAW
=====================

Valve release:
${STEAMOS_VERSION}

SteamOS release:
${STEAMOS_RELEASE}

Source:
${STEAMOS_URL}

Base image:
${IMAGE_SIZE}

Output:
SteamOS-installed.img

Automatic first boot expansion:
YES

First boot behavior:

1. Detecta el disco físico.
2. Mueve la GPT secundaria al final.
3. Detecta la partición 8.
4. Extiende la partición 8.
5. Extiende el filesystem.
6. Crea .steamos-firstboot-grow-complete.
7. No vuelve a ejecutarse.

SHA256:
$(cat SteamOS-installed.img.sha256)
EOF

          cat BUILD-INFO.txt

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload SteamOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SteamOS-installed-${{ env.STEAMOS_VERSION }}-${{ env.STEAMOS_RELEASE }}
          compression-level: 0
          if-no-files-found: error
          path: |
            /home/runner/steamos-build/output/SteamOS-installed.img.zst.part-*
            /home/runner/steamos-build/output/SteamOS-installed.img.sha256
            /home/runner/steamos-build/output/BUILD-INFO.txt
            /home/runner/steamos-build/output/JOIN-WINDOWS.ps1

      # ============================================================
      # RESUMEN
      # ============================================================

      - name: Summary
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "=============================================="
          echo "STEAMOS BUILD TERMINADO"
          echo "=============================================="
          echo

          ls -lh "${WORKDIR}/output"

          echo
          echo "SHA256:"
          cat "${WORKDIR}/output/SteamOS-installed.img.sha256"
